version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ns_postgres_db
    restart: always
    environment:
      POSTGRES_DB: seguimiento_ns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ns_express_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres_secure_pass_123@db:5432/seguimiento_ns
    depends_on:
      - db
    ports:
      - "5001:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ns_react_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
    driver: local
